# ============================================================================
# RAG向量入库工具 - 应用配置
# ============================================================================
# 本文件中所有标注 TODO 的配置项需要根据实际环境填写
# ============================================================================

server:
  port: 8080

spring:
  application:
    name: rag-vector-tool
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 500MB
  # ---------- MySQL数据源（用户/权限/版本持久化） ----------
  datasource:
    url: jdbc:mysql://localhost:3306/rag_tool?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: semine
    password: semine123456
    driver-class-name: com.mysql.cj.jdbc.Driver

# ==================== MyBatis 配置 ====================
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.rag.core.entity
  type-handlers-package: com.rag.auth.typehandler
  configuration:
    map-underscore-to-camel-case: true

# ==================== RAG核心配置 ====================
rag:
  # ---------- DeepSeek-OCR 配置（OpenAI 兼容远程端点，图片/文档统一识别） ----------
  deepseek-ocr:
    api-key: sk-raqbnrbttmyutrdghyfmgxhalqvplggtxbikhsksxjpekzak
    # 硅基流动 Base URL（客户端会自动追加 /chat/completions）
    base-url: https://api.siliconflow.cn/v1
    # 远程部署的 DeepSeek-OCR 模型名
    model: deepseek-ai/DeepSeek-OCR
    # 远程调用超时（毫秒）
    timeout-ms: 120000

  # ---------- Embedding模型配置（远程 API，均走 OpenAI 兼容协议） ----------
  embedding:
    # 默认模型类型: tongyi / bge-m3 / openai
    type: tongyi

    # Qwen3 Embedding 配置（当模型名含 qwen/tongyi 时生效，走硅基流动）
    tongyi:
      api-key: sk-raqbnrbttmyutrdghyfmgxhalqvplggtxbikhsksxjpekzak
      # 硅基流动 Base URL（客户端会自动追加 /embeddings）
      base-url: https://api.siliconflow.cn/v1
      # 硅基流动模型名
      model: Qwen/Qwen3-Embedding-0.6B
      # 向量维度（需与 Weaviate 集合维度一致）
      dim: 1024

    # BGE-M3 配置（当模型名含 bge 时生效，走硅基流动）
    bge-m3:
      api-key: sk-raqbnrbttmyutrdghyfmgxhalqvplggtxbikhsksxjpekzak
      # 硅基流动 Base URL（客户端会自动追加 /embeddings）
      base-url: https://api.siliconflow.cn/v1
      # 模型名称
      model: BAAI/bge-m3
      # 向量维度（需与 Weaviate 集合维度一致）
      dim: 1024

    # OpenAI 兼容配置（当模型名含 text-embedding/openai 时生效）
    openai:
      api-key: sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      # OpenAI 兼容 Base URL（客户端会自动追加 /embeddings）
      base-url: https://api.openai.com/v1
      # 模型名称
      model: text-embedding-3-small
      # 向量维度（text-embedding-3-small=1536）
      dim: 1536

  # ---------- Weaviate向量库配置 ----------
  weaviate:
    url: http://192.168.71.12:8080
    # 访问令牌（Weaviate 开启鉴权时填写，否则留空）
    token: ${RAG_WEAVIATE_TOKEN:}
    collection: Document_V1

  # ---------- 鉴权与安全配置（需求6-7） ----------
  auth:
    jwt:
      #   可使用 openssl rand -base64 32 命令生成
      secret: rag-tool-default-secret-key-change-in-production-min-256-bits!!
      # accessToken有效期（毫秒），默认2小时
      access-expiration: 7200000
      # refreshToken有效期（毫秒），默认7天
      refresh-expiration: 604800000
    login:
      max-fail-count: 5
      lock-minutes: 30

  # ---------- 版本管理配置（需求7） ----------
  version:
    keep-versions: 10
    auto-clean-enabled: false
    auto-clean-cron: "0 0 2 * * ?"

  # ---------- MinIO文件存储配置（可选） ----------
  minio:
    # 是否启用MinIO（true/false），默认使用本地文件系统
    enabled: false
    # 当 enabled=false 时，上传文件持久化到该本地目录（相对路径基于应用启动目录）
    local-path: ./data/uploads
    # TODO: 填入MinIO服务地址
    endpoint: http://localhost:9000
    # TODO: 填入MinIO Access Key
    access-key: minioadmin
    # TODO: 填入MinIO Secret Key
    secret-key: minioadmin
    # TODO: 填入Bucket名称
    bucket: rag-documents

# ==================== 日志配置 ====================
logging:
  level:
    com.rag: DEBUG
    io.weaviate: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
