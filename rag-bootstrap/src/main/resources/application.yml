# RAG向量入库工具 - 应用配置
# ============================================================================
# 本文件中所有标注 TODO 的配置项需要根据实际环境填写
# 模型配置清单见 application.public.yml
# ============================================================================

# 导入公共模型配置
spring:
  config:
    import:
      - classpath:application.public.yml
  application:
    name: rag-vector-tool
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 500MB
  # ---------- MySQL数据源（用户/权限/版本持久化） ----------
  datasource:
    url: jdbc:mysql://localhost:3306/rag_tool?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: semine
    password: semine123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  # ---------- Redis（问答多轮会话存储） ----------
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5000ms

server:
  port: 8080

# ==================== MyBatis 配置 ====================
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.rag.common.entity
  type-handlers-package: com.rag.auth.typehandler
  configuration:
    map-underscore-to-camel-case: true

# ==================== RAG核心配置 ====================
rag:
  # ---------- Weaviate向量库配置 ----------
  weaviate:
    url: http://192.168.71.12:8080
    # 访问令牌（Weaviate 开启鉴权时填写，否则留空）
    token: ${RAG_WEAVIATE_TOKEN:}
    collection: Document_V1

  # ---------- 检索配置（多路召回默认参数） ----------
  search:
    # 默认检索模式: VECTOR_ONLY / BM25_ONLY / HYBRID
    default-mode: VECTOR_ONLY
    # ===== BM25 默认参数（Weaviate 服务端内部管理，此处预留） =====
    bm25:
      # k1 参数（默认 1.2），控制词频饱和度
      k1: 1.2
      # b 参数（默认 0.75），控制文档长度归一化
      b: 0.75
    # ===== RRF 融合默认参数 =====
    rrf:
      # RRF 常数 k（默认 60），值越大排名越平滑
      k: 60
    # ===== 加权求和默认参数 =====
    weighted:
      # 向量检索默认权重
      vector-weight: 0.5
      # BM25 检索默认权重
      bm25-weight: 0.5


  # ---------- 问答（Chat）全局配置（知识库级配置可覆盖，优先级：请求参数 > 知识库配置 > 此处全局默认） ----------
  chat:
    # 问答能力全局总开关（关闭时所有问答接口返回禁用提示，对纯检索接口零影响）
    enabled: true
    # 默认对话模型（spring.ai.platform.models 中的逻辑模型名，须为 CHAT 类别）
    chat-model: qwen-turbo
    # 查询改写开关（多轮上下文补全 + 复杂查询优化，失败自动降级为原始查询）
    rewrite-enabled: true
    # 查询改写模型（为空时复用 chat-model）
    rewrite-model:
    # 上下文窗口 Token 预算（召回片段按相似度优先级截断）
    context-window-tokens: 6000
    # 多轮对话历史最大保留轮次（一轮 = 一问一答）
    max-history-rounds: 10
    # 历史上下文 Token 总量上限（与轮次双重裁剪）
    history-max-tokens: 3000
    # 会话过期时间（秒），超时未访问自动清理
    session-ttl-seconds: 3600
    # 临时上传文档生命周期（秒），随会话清理或超时自动清理
    temp-doc-ttl-seconds: 1800
    # 临时文档最大数量（单次问答请求）
    temp-doc-max-count: 5
    # 输入输出内容安全校验开关
    safety-check-enabled: true
    # 默认系统提示词（知识库级自定义提示词可覆盖）
    default-system-prompt: |
      你是一个严谨的知识库问答助手。请严格遵守以下规则：
      1. 仅基于下方提供的参考资料回答用户问题，禁止编造资料中不存在的信息。
      2. 引用资料内容时，在引用处标注引用编号，格式为 [n]，n 与资料编号一一对应。
      3. 若参考资料不足以回答问题，请明确告知用户“根据现有资料无法回答”，不要猜测。
      4. 回答使用与用户提问相同的语言，保持简洁、准确、有条理。

  # ---------- 鉴权与安全配置（需求6-7） ----------
  auth:
    jwt:
      #   可使用 openssl rand -base64 32 命令生成
      secret: rag-tool-default-secret-key-change-in-production-min-256-bits!!
      # accessToken有效期（毫秒），默认2小时
      access-expiration: 7200000
      # refreshToken有效期（毫秒），默认7天
      refresh-expiration: 604800000
    login:
      max-fail-count: 5
      lock-minutes: 30

  # ---------- 版本管理配置（需求7） ----------
  version:
    keep-versions: 10
    auto-clean-enabled: false
    auto-clean-cron: "0 0 2 * * ?"

  # ---------- MinIO文件存储配置（可选） ----------
  minio:
    # 是否启用MinIO（true/false），默认使用本地文件系统
    enabled: false
    # 当 enabled=false 时，上传文件持久化到该本地目录（相对路径基于应用启动目录）
    local-path: ./data/uploads
    # TODO: 填入MinIO服务地址
    endpoint: http://localhost:9000
    # TODO: 填入MinIO Access Key
    access-key: minioadmin
    # TODO: 填入MinIO Secret Key
    secret-key: minioadmin
    # TODO: 填入Bucket名称
    bucket: rag-documents

# ==================== 日志配置 ====================
logging:
  level:
    com.rag: DEBUG
    io.weaviate: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
