# RAG向量入库工具 - 应用配置
# ============================================================================
# 本文件中所有标注 TODO 的配置项需要根据实际环境填写
# 大模型配置清单见 application.public.yml（该文件只保留 spring.ai.platform.models）
#
# 职责边界：
#   - application.public.yml ：仅「大模型配置清单」（spring.ai.platform.models）
#   - application.yml（本文件）：环境相关配置 + 运行参数（rag.embedding / rag.deepseek-ocr / rag.parser 等）
#   因本文件通过 spring.config.import 导入 public.yml，本文件优先级更高，
#   故上述运行参数统一放在本文件中作为唯一来源，避免双写导致"改 public.yml 不生效"。
# ============================================================================

# 导入公共模型配置
spring:
  config:
    import:
      - classpath:application.public.yml
  autoconfigure:
    exclude:
      # DashScope全部自动配置（由DashScopeModelAdapter适配器按需创建模型）
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeChatAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeEmbeddingAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAgentAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioSpeechAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioTranscriptionAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeImageAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeVideoAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeRerankAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAsyncToolCallingManagerAutoConfiguration
      # Ollama全部自动配置（由OllamaModelAdapter适配器按需创建模型）
      - org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration
      
  application:
    name: rag-vector-tool
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 500MB
  # ---------- MySQL数据源（用户/权限/版本持久化） ----------
  datasource:
    url: jdbc:mysql://localhost:3306/rag_tool?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: semine
    password: semine123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  # ---------- Redis（问答多轮会话存储） ----------
  data:
    redis:
      host: localhost
      port: 6379
      password: semine123456
      database: 0
      timeout: 5000ms
  # ---------- OpenAI API Key（占位，满足spring-ai-starter-model-openai自动配置校验，
  #   项目实际使用spring.ai.platform.models自定义配置，不走OpenAI官方API） ----------
  ai:
    openai:
      api-key: unused

server:
  port: 8080

# ==================== MyBatis 配置 ====================
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.rag.common.entity
  type-handlers-package: com.rag.auth.typehandler
  configuration:
    map-underscore-to-camel-case: true

# ==================== RAG核心配置 ====================
rag:
  # ---------- Weaviate向量库配置 ----------
  weaviate:
    url: http://192.168.71.16:8080
    # 访问令牌（Weaviate 开启鉴权时填写，否则留空）
    token: ${RAG_WEAVIATE_TOKEN:}
    collection: Document_V1

  # ---------- 检索配置（多路召回默认参数） ----------
  search:
    # 默认检索模式: VECTOR_ONLY / BM25_ONLY / HYBRID
    default-mode: VECTOR_ONLY
    # ===== BM25 默认参数（Weaviate 服务端内部管理，此处预留） =====
    bm25:
      # k1 参数（默认 1.2），控制词频饱和度
      k1: 1.2
      # b 参数（默认 0.75），控制文档长度归一化
      b: 0.75
    # ===== RRF 融合默认参数 =====
    rrf:
      # RRF 常数 k（默认 60），值越大排名越平滑
      k: 60
    # ===== 加权求和默认参数 =====
    weighted:
      # 向量检索默认权重
      vector-weight: 0.5
      # BM25 检索默认权重
      bm25-weight: 0.5

  # ---------- Embedding 兼容配置（KbConfigService / AdminController.resolveEmbeddingDim 读取） ----------
  # ⚠ 本段为兼容旧链路保留，迁移自 application.public.yml。
  #   其中 api-key / base-url / model 三项与 spring.ai.platform.models 下的
  #   bge-m3 / tongyi / openai 重复，实际代码只消费 type 与 dim（真实密钥与端点走 models 段）；
  #   但因 EmbeddingConfig.baseUrl / modelSource 仍由此灌入，保留以免留下空字段隐患。
  #   后续如统一到 spring.ai.platform.models.extensions 后可整体删除。
  embedding:
    # 默认模型类型：tongyi / bge-m3 / openai
    type: bge-m3
    bge-m3:
      api-key: sk-raqbnrbttmyutrdghyfmgxhalqvplggtxbikhsksxjpekzak
      base-url: https://api.siliconflow.cn/v1
      model: BAAI/bge-m3
      dim: 1024
    tongyi:
      api-key: sk-raqbnrbttmyutrdghyfmgxhalqvplggtxbikhsksxjpekzak
      base-url: https://api.siliconflow.cn/v1
      model: Qwen/Qwen3-Embedding-0.6B
      dim: 1024
    openai:
      api-key: sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      base-url: https://api.openai.com/v1
      model: text-embedding-3-small
      dim: 1536

  # ---------- OCR 识别模型（RagCoreConfig 读取后透传 DeepSeekOcrParser / TikaOcrMixedParser） ----------
  # ⚠ 迁移自 application.public.yml。api-key / base-url / model 与 spring.ai.platform.models.deepseek-ocr 重复，
  #   此处由 RagCoreConfig @Value 直连读取（未走 models 适配器），暂需保留。
  deepseek-ocr:
    api-key: sk-raqbnrbttmyutrdghyfmgxhalqvplggtxbikhsksxjpekzak
    base-url: https://api.siliconflow.cn/v1
    model: deepseek-ai/DeepSeek-OCR
    timeout-ms: 120000
    # 通用 OCR 输出 token 上限（内嵌图 / 非 PDF 整份回退 OCR 使用）
    max-tokens: 4096
    # 扫描件 PDF 逐页 OCR 的页输出 token 上限。
    # ⚠ 约束：DeepSeek-OCR 总上下文（输入+输出）仅 8192，而单页 A4 图片输入约 1500~2500 vision token，
    #    故输出上限不可设为 8192（8192 + 图片输入 > 8192 → 服务端必然返回 HTTP 400）。
    #    4096 可覆盖文字密集页（约 2000~3000 token），且 4096 + 输入 ≈ 5500~6600 < 8192，安全。
    page-max-tokens: 4096

  # ---------- 文档解析器路由（RagCoreConfig.documentParseFactory 读取） ----------
  # ⚠ 本配置的唯一来源即为本文件（application.yml）；不要再写入 application.public.yml，
  #   该文件被本文件 spring.config.import 导入，优先级更低，双写会导致"改 public 不生效"。
  parser:
    # PDF 解析器提供方：
    #   mineru     —— 默认，PDF 走 MinerUParser（当前为路由骨架，实际解析待实现，PDF 会报未实现异常）
    #   tika-mixed —— 回退，PDF 走 TikaOcrMixedParser（Tika 文本 + 内嵌图 OCR + 扫描件逐页 OCR）
    # 注：上传接口传 modelName=minerU 时，任意文件类型均强制走 MinerUParser（优先级最高）
    pdf-provider: mineru


  # ---------- 问答（Chat）全局配置（知识库级配置可覆盖，优先级：请求参数 > 知识库配置 > 此处全局默认） ----------
  chat:
    # 问答能力全局总开关（关闭时所有问答接口返回禁用提示，对纯检索接口零影响）
    enabled: true
    # 默认对话模型（spring.ai.platform.models 中的逻辑模型名，须为 CHAT 类别）
    # 原 qwen-turbo(Qwen/Qwen2.5-7B-Instruct) 幻觉严重已移除，改用 deepseek-v4-flash
    chat-model: deepseek-v4-flash
    # 查询改写开关（多轮上下文补全 + 复杂查询优化，失败自动降级为原始查询）
    rewrite-enabled: true
    # 查询改写模型（为空时复用 chat-model）0
    rewrite-model:
    # 上下文窗口 Token 预算（召回片段按相似度优先级截断）
    context-window-tokens: 6000
    # 多轮对话历史最大保留轮次（一轮 = 一问一答）
    max-history-rounds: 10
    # 历史上下文 Token 总量上限（与轮次双重裁剪）
    history-max-tokens: 3000
    # 会话过期时间（秒），超时未访问自动清理
    session-ttl-seconds: 3600
    # 临时上传文档生命周期（秒），随会话清理或超时自动清理
    temp-doc-ttl-seconds: 1800
    # 临时文档最大数量（单次问答请求）
    temp-doc-max-count: 5
    # 输入输出内容安全校验开关
    safety-check-enabled: true
    # 相似度阈值（0.0~1.0），低于此值的召回片段过滤
    similarity-threshold: 0.5
    # 默认系统提示词（知识库级自定义提示词可覆盖）
    default-system-prompt: |
      你是一个严谨的知识库问答助手。请严格遵守以下规则：
      1. 仅基于下方提供的参考资料回答用户问题，禁止编造资料中不存在的信息。
      2. 引用资料内容时，在引用处标注引用编号，格式为 [n]，n 与资料编号一一对应。
      3. 若参考资料不足以回答问题，请明确告知用户“根据现有资料无法回答”，不要猜测。
      4. 回答使用与用户提问相同的语言，保持简洁、准确、有条理。
    pre-query-filter-enabled: true
    # 分类用模型（为空复用 chat-model，全程复用现有对话模型）
    pre-query-filter-model:
    pre-query-filter-prompt: |
      你的任务：问题分类，判断用户问题是否属于【和业务知识库无关】的问题。
      判定规则：
      满足下面任意一类，输出【是】；否则输出【否】
      1. 闲聊互动：打招呼、情绪倾诉、玩笑
      2. 通用常识：百科通识、基础科学常识
      3. 实时信息：日期、星期、天气、实时新闻、实时股价这类随时间变化的动态信息
      只有问题需要查询【指定业务知识库】里独有的文档资料，才输出【否】
      问题：{query}
    pre-query-filter-answer-prompt: |
      你是一个通用 AI 助手。请遵循以下规则回答用户问题：
      1. 针对通用常识、闲聊互动类问题，直接给出简洁、准确、有条理的回答，不要编造、不要推测、不要引入虚构信息。
      2. 针对实时信息类问题（如天气、新闻、股票行情、时间日期、正在发生的事件等），由于我无法获取实时数据，
         请明确告知用户"我无法提供实时准确信息，建议以最新官方渠道为准"，绝不可给出过时或臆测的数据，准确性优先于完整作答。
      3. 回答保持简洁克制，用最少的篇幅讲清要点即可，避免冗余展开、堆砌细节或过度解释，以控制生成成本与响应速度。
      4. 回答使用与用户提问相同的语言。
    # 被拦截的通用回答前置标注（回答开头强制追加）
    pre-query-filter-tag: 该回答为通用知识，未参考本知识库内容
    # 分类调用超时兜底（毫秒），超过视为分类失败并放行 RAG 链路
    pre-query-filter-timeout-ms: 5000

  # ---------- 鉴权与安全配置（需求6-7） ----------
  auth:
    jwt:
      #   可使用 openssl rand -base64 32 命令生成
      secret: rag-tool-default-secret-key-change-in-production-min-256-bits!!
      # accessToken有效期（毫秒），默认2小时
      access-expiration: 7200000
      # refreshToken有效期（毫秒），默认7天
      refresh-expiration: 604800000
    login:
      max-fail-count: 5
      lock-minutes: 30

  # ---------- 版本管理配置（需求7） ----------
  version:
    keep-versions: 10
    auto-clean-enabled: false
    auto-clean-cron: "0 0 2 * * ?"

  # ---------- MinIO文件存储配置（可选） ----------
  minio:
    # 是否启用MinIO（true/false），默认使用本地文件系统
    enabled: false
    # 当 enabled=false 时，上传文件持久化到该本地目录（相对路径基于应用启动目录）
    local-path: ./data/uploads
    # TODO: 填入MinIO服务地址
    endpoint: http://localhost:9000
    # TODO: 填入MinIO Access Key
    access-key: minioadmin
    # TODO: 填入MinIO Secret Key
    secret-key: minioadmin
    # TODO: 填入Bucket名称
    bucket: rag-documents

# ==================== 日志配置 ====================
logging:
  level:
    com.rag: DEBUG
    io.weaviate: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
