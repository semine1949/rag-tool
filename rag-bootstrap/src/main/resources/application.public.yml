# ============================================================================
# RAG向量入库工具 - 大模型配置清单（唯一来源）
# ============================================================================
# 本文件列出项目所有用到的大模型，统一通过 spring.ai.platform.models 声明。
# 通过 category（类别）+ protocol（协议）路由到对应适配器，支持动态切换。
#
# 模型特有但 ModelConfig 未声明的参数（如 Embedding 的 dim、
# OCR 的 max-tokens / page-max-tokens）统一写入对应模型的 extensions 段。
#
# 优先级（重要）：本文件由 application.yml 通过 spring.config.import 导入，
#   按 Spring Boot 2.4+ 规则「被导入文档优先」，本文件同名 key 会覆盖 application.yml。
#   故模型相关配置只允许写在本文件，严禁与 application.yml 双写。
#
# API Key 等敏感信息请按环境填写。
# ============================================================================

spring:
  ai:
    platform:
      models:
        # ==================== Embedding 向量化模型 ====================
        # BAAI/bge-m3 — 硅基流动（默认）
        bge-m3:
          category: EMBEDDING
          protocol: OPENAI
          base-url: https://api.siliconflow.cn
          api-key: sk-raqbnrbttmyutrdghyfmgxhalqvplggtxbikhsksxjpekzak
          model-name: BAAI/bge-m3
          extensions:
            dim: 1024
        # Qwen/Qwen3-Embedding-0.6B — 硅基流动
        tongyi:
          category: EMBEDDING
          protocol: OPENAI
          base-url: https://api.siliconflow.cn
          api-key: sk-raqbnrbttmyutrdghyfmgxhalqvplggtxbikhsksxjpekzak
          model-name: Qwen/Qwen3-Embedding-0.6B
          extensions:
            dim: 1024
        # text-embedding-3-small — OpenAI 官方
        openai:
          category: EMBEDDING
          protocol: OPENAI
          base-url: https://api.openai.com
          api-key: sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          model-name: text-embedding-3-small
          extensions:
            dim: 1536

        # ==================== Rerank 重排序模型 ====================
        # Qwen/Qwen3-Reranker — 硅基流动（候选池放大、限流参数通过 extensions 传递）
        qwen3-rerank:
          category: RERANK
          protocol: OPENAI
          base-url: https://api.siliconflow.cn
          api-key: sk-raqbnrbttmyutrdghyfmgxhalqvplggtxbikhsksxjpekzak
          model-name: Qwen/Qwen3-Reranker
          extensions:
            batch-size: 20
            max-qps: 5
            candidate-multiplier: 3

        # ==================== Chat 对话模型（问答链路） ====================
        # deepseek-ai/DeepSeek-R1 — 硅基流动（推理型：回答前先生成思维链 CoT，适合复杂推理/深度分析）
        # 调温依据：R1 采样温度对输出影响大，官方推荐 0.5~0.7 与 top_p 0.7（过低易使推理退化、过高易发散）；
        # 思维链会占用较多输出 token，max-tokens 需放大避免截断。
        deepseek-r1:
          category: CHAT
          protocol: OPENAI
          base-url: https://api.siliconflow.cn
          api-key: sk-raqbnrbttmyutrdghyfmgxhalqvplggtxbikhsksxjpekzak
          model-name: deepseek-ai/DeepSeek-R1
          # 模型级默认温度（R1 官方推荐区间 0.5~0.7）
          temperature: 0.6
          # R1 官方推荐核采样
          top-p: 0.7
          scene-temperatures:
            # 分类/改写若落到 R1：确定性任务走低温
            classify: 0.0
            rewrite: 0.0
            # RAG 问答：沿用官方 0.6，兼顾思维链稳定性与回答忠实度
            rag-qa: 0.6
            # 通用问答：R1 为推理模型而非闲聊模型，保持 0.6 即可
            chat-qa: 0.6
          max-tokens: 8192
          stream-enabled: true

        # deepseek-ai/DeepSeek-V4-Flash — 硅基流动（V4 系列"效率之选"：1M 超长上下文、高吞吐、低成本，适合高并发/长文档问答）
        # 调温依据：通用对话型 MoE，默认 0.7；RAG 有检索上下文做事实锚点故降温到 0.3 提升严谨性。
        deepseek-v4-flash:
          category: CHAT
          protocol: OPENAI
          base-url: https://api.siliconflow.cn
          api-key: sk-raqbnrbttmyutrdghyfmgxhalqvplggtxbikhsksxjpekzak
          model-name: deepseek-ai/DeepSeek-V4-Flash
          # 模型级默认温度
          temperature: 0.7
          scene-temperatures:
            classify: 0.0
            rewrite: 0.0
            # 知识库问答：基于检索上下文严谨回答，低温
            rag-qa: 0.3
            # 通用问答/闲聊：允许适度发散
            chat-qa: 0.7
          max-tokens: 8192
          stream-enabled: true

        # Qwen/Qwen3.5-122B-A10B — 硅基流动（旗舰级 MoE，混合线性注意力 + 稀疏专家，256K 上下文，指令遵循与复杂推理强）
        # 调温依据：Qwen3.5 系列官方建议常规对话 0.7；RAG 问答带检索锚点用 0.3 保证引用准确、减少幻觉。
        # 注意：逻辑 key 不能用点号（如 qwen3.5-122b），@ConfigurationProperties 绑定 Map 时点号会被当作层级分隔符导致条目丢失。
        qwen35-122b:
          category: CHAT
          protocol: OPENAI
          base-url: https://api.siliconflow.cn
          api-key: sk-raqbnrbttmyutrdghyfmgxhalqvplggtxbikhsksxjpekzak
          model-name: Qwen/Qwen3.5-122B-A10B
          temperature: 0.7
          scene-temperatures:
            classify: 0.0
            rewrite: 0.0
            rag-qa: 0.3
            chat-qa: 0.7
          max-tokens: 8192
          stream-enabled: true

        # Qwen/Qwen3.6-35B-A3B — 硅基流动（35B 总参 / 3B 激活 MoE，智能体编程与多模态推理能力突出，成本效率高）
        # 调温依据：定位为"小钢炮"通用推理模型，指令遵循好；常规对话 0.7，RAG 场景 0.3 以贴近文档事实。
        # 注意：逻辑 key 不能用点号（原因同上），故命名为 qwen36-35b。
        qwen36-35b:
          category: CHAT
          protocol: OPENAI
          base-url: https://api.siliconflow.cn
          api-key: sk-raqbnrbttmyutrdghyfmgxhalqvplggtxbikhsksxjpekzak
          model-name: Qwen/Qwen3.6-35B-A3B
          temperature: 0.7
          scene-temperatures:
            classify: 0.0
            rewrite: 0.0
            rag-qa: 0.3
            chat-qa: 0.7
          max-tokens: 8192
          stream-enabled: true

        # ==================== OCR 识别模型 ====================
        deepseek-ocr:
          category: OCR
          protocol: OPENAI
          base-url: https://api.siliconflow.cn
          api-key: sk-raqbnrbttmyutrdghyfmgxhalqvplggtxbikhsksxjpekzak
          model-name: deepseek-ai/DeepSeek-OCR
          extensions:
            timeout-ms: 120000
            max-tokens: 4096
            page-max-tokens: 4096

        # ==================== 文档解析服务（非模型，走自有 HTTP 端点） ====================
        # MinerU 官方 API（精准解析）：PDF 的默认解析器，产出结构化 Markdown（含版面/表格/公式还原）。
        # 上传接口传 modelName=minerU 时强制使用；PDF 默认也走此解析器（由 rag.parser.pdf-provider 控制）。
        #
        # 【使用前必读】api-key 需由你在 mineru.net「API 管理」页面创建 Token 后替换占位符，
        #   否则调用会直接报「MinerU 凭证未配置」。Token 格式为 Bearer Token，此处只填 Token 本身。
        # 【接口限制】文件 ≤ 200MB、≤ 200 页；上传链接有效期 24 小时；单账号每日 1000 页最高优先级额度。
        # 【快速回退】若 MinerU 不可用，将 application.yml 的 rag.parser.pdf-provider 改为 tika-mixed 即可
        #   回退到原有「Tika 文本 + 内嵌图 OCR + 扫描件逐页 OCR」链路，无需改代码。
        mineru:
          # PARSER = 文档解析类服务，区别于 OCR 图像识别模型；不参与 AiModelFactory 的模型实例创建
          category: PARSER
          protocol: OPENAI
          # 官方 API 根地址（精准解析 API）
          base-url: https://mineru.net
          # TODO 必填：在 mineru.net「API 管理」页面创建 Token 后替换此项
          api-key: your-mineru-api-key
          # 逻辑名标识（MinerU 无模型 ID 概念，此处填服务名即可）
          model-name: mineru
          extensions:
            # 模型版本：pipeline（默认，速度快）/ vlm（推荐，版面与公式还原更好）/ MinerU-HTML（HTML 专用）
            model-version: vlm
            # 文档语言（ch / en 等），仅对 pipeline、vlm 有效
            language: ch
            # 是否开启公式识别（仅对 pipeline、vlm 有效）
            enable-formula: true
            # 是否开启表格识别（仅对 pipeline、vlm 有效）
            enable-table: true
            # 单次 HTTP 请求超时（毫秒），覆盖申请链接 / 上传 / 单次轮询 / 下载结果包
            timeout-ms: 60000
            # 轮询间隔（毫秒）：两次查询解析状态之间的等待时间
            poll-interval-ms: 5000
            # 最大轮询次数：与 poll-interval-ms 共同构成总等待上限（5000 × 120 = 10 分钟）
            max-poll-count: 120